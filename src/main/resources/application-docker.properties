# Profile-specific overrides for running the app as a container in this compose stack.
# Activate with: SPRING_PROFILES_ACTIVE=docker

# MongoDB
spring.data.mongodb.uri=mongodb://admin:password@mongodb:27017/visionservice?authSource=admin

# MinIO Configuration
app.minio.endpoint=http://minio:9000

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq

# Spring AI Ollama Configuration
spring.ai.ollama.base-url=http://ollama:11434

# Qdrant Vector Store
spring.ai.vectorstore.qdrant.host=qdrant

# Tracing & OpenTelemetry Configuration (exported to Tempo via OTLP/HTTP)
management.otlp.tracing.endpoint=http://tempo:4318/v1/traces

# Loki push endpoint for application logs (loki-logback-appender)
loki.url=http://loki:3100/loki/api/v1/push
