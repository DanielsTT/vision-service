version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: visionservice-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=visionservice
    volumes:
      - mongo_data:/data/db
    networks:
      - vision-network
    labels:
      - "logging=promtail"
      - "logging_jobname=mongodb"

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: visionservice-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - vision-network
    labels:
      - "logging=promtail"
      - "logging_jobname=rabbitmq"

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: visionservice-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - vision-network
    labels:
      - "logging=promtail"
      - "logging_jobname=qdrant"

  minio:
    image: minio/minio:latest
    container_name: visionservice-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - vision-network
    labels:
      - "logging=promtail"
      - "logging_jobname=minio"

  ollama:
    image: ollama/ollama:latest
    container_name: visionservice-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama run llava && ollama pull nomic-embed-text && tail -f /dev/null" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - vision-network
    labels:
      - "logging=promtail"
      - "logging_jobname=ollama"

  prometheus:
    image: prom/prometheus:latest
    container_name: visionservice-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vision-network
    labels:
      - "logging=promtail"
      - "logging_jobname=prometheus"

  grafana:
    image: grafana/grafana:latest
    container_name: visionservice-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - vision-network
    depends_on:
      - prometheus
      - loki
      - tempo
    labels:
      - "logging=promtail"
      - "logging_jobname=grafana"

  loki:
    image: grafana/loki:3.3.0
    container_name: visionservice-loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - vision-network
    labels:
      - "logging=promtail"
      - "logging_jobname=loki"

  promtail:
    image: grafana/promtail:3.3.0
    container_name: visionservice-promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - vision-network
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.6.1
    container_name: visionservice-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo.yaml
    networks:
      - vision-network
    labels:
      - "logging=promtail"
      - "logging_jobname=tempo"

volumes:
  mongo_data:
  rabbitmq_data:
  qdrant_data:
  minio_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  vision-network:
    driver: bridge
