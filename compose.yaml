version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: visionservice-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=visionservice
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: visionservice-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: visionservice-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: visionservice-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  ollama:
    image: ollama/ollama:latest
    container_name: visionservice-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama run llava && ollama pull nomic-embed-text && tail -f /dev/null" ]
#    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama run llava-phi3 && ollama pull nomic-embed-text && tail -f /dev/null" ]
#    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama run llava:13b && ollama pull nomic-embed-text && tail -f /dev/null" ]
#    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama run llava:34b && ollama pull nomic-embed-text && tail -f /dev/null" ]
#    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama run minicpm-v && ollama pull nomic-embed-text && tail -f /dev/null" ]
#    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama run moondream && ollama pull nomic-embed-text && tail -f /dev/null" ]
#    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama run bakllava && ollama pull nomic-embed-text && tail -f /dev/null" ]
#    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama run qwen2-vl && ollama pull nomic-embed-text && tail -f /dev/null" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  mongo_data:
  rabbitmq_data:
  qdrant_data:
  minio_data:
  ollama_data: